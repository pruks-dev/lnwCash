# =============================================================================
# Nginx v4 Configuration — LnwCash Wallet (Local Deploy)
# =============================================================================
# สำหรับ deploy บนเครื่อง local / development
# - Port: 8080 (non-root)
# - เข้าถึงผ่าน IP address เท่านั้น (server_name: _)
# - Root: /home/debian/arx-projects/lnw-cash/dist/
#
# วิธีใช้:
#   1. sudo cp infra/nginx/nginx-v4-local.conf /etc/nginx/sites-available/lnw-cash
#   2. sudo ln -s /etc/nginx/sites-available/lnw-cash /etc/nginx/sites-enabled/
#   3. sudo rm -f /etc/nginx/sites-enabled/default
#   4. sudo nginx -t
#   5. sudo systemctl reload nginx
# =============================================================================

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # =========================================================================
    # Document Root
    # =========================================================================
    root /home/debian/arx-projects/lnw-cash/dist/;
    index index.html;

    # =========================================================================
    # Gzip Compression
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/html
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # =========================================================================
    # Security Headers
    # =========================================================================
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src *; font-src 'self'" always;

    # =========================================================================
    # Health Endpoint (static JSON)
    # =========================================================================
    location = /health {
        default_type application/json;
        return 200 '{"status":"healthy","version":"0.1.0","timestamp":"2026-07-30T00:00:00+07:00"}\n';
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # =========================================================================
    # Cache Rules
    # =========================================================================

    # index.html — ห้าม cache (SPA entry point ต้องโหลดใหม่เสมอ)
    location = /index.html {
        expires 0;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Hashed assets (JS/CSS จาก Vite build) — immutable long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Service Worker และ Workbox — ห้าม cache
    location ~ ^/(sw\.js|workbox-.*\.js|registerSW\.js)$ {
        expires 0;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # favicon และ icon files — 7 วัน
    location ~ ^/(favicon\.svg|icon-.*\.png|icons\.svg)$ {
        expires 7d;
        add_header Cache-Control "public" always;
    }

    # PWA manifest — 1 วัน
    location = /manifest.webmanifest {
        expires 1d;
        add_header Cache-Control "public" always;
    }

    # =========================================================================
    # SPA Routing Fallback
    # =========================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =========================================================================
    # Deny Hidden Files
    # =========================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # =========================================================================
    # Deny Sensitive Files
    # =========================================================================
    # บล็อกไฟล์ที่อาจมีข้อมูล sensitive:
    #   .sql, .log, .env, .yml, .yaml, .md, .json
    # ยกเว้น /manifest.webmanifest (ไม่ตรง regex) และ /health (exact match ข้างบน)
    location ~* \.(sql|log|env|yml|yaml|md|json)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # =========================================================================
    # Logging
    # =========================================================================
    access_log /var/log/nginx/lnw-cash-access.log;
    error_log  /var/log/nginx/lnw-cash-error.log warn;
}
