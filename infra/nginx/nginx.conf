# =============================================================================
# Nginx Configuration — LnwCash Wallet (SPA Static Hosting)
# =============================================================================
# ใช้คู่กับ Cloudflare (terminates SSL ที่ edge)
# VPS รับเฉพาะ HTTP จาก Cloudflare (หรือ HTTPS ด้วย Origin Certificate)
#
# วิธีใช้:
#   1. sudo cp nginx.conf /etc/nginx/sites-available/lnw.cash
#   2. sudo ln -s /etc/nginx/sites-available/lnw.cash /etc/nginx/sites-enabled/
#   3. sudo nginx -t   # ตรวจสอบ syntax
#   4. sudo systemctl reload nginx
# =============================================================================

# ---------------------------------------------------------------------------
# HTTP → HTTPS Redirect (port 80)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name lnw.cash www.lnw.cash;

    # Cloudflare ใช้ Flexible/Full SSL แล้ว redirect นี้จะ redirect
    # HTTP requests (จาก user) มาเป็น HTTPS
    # ถ้าใช้ Cloudflare "Always Use HTTPS" ก็สามารถ comment ส่วนนี้ได้
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# HTTPS Static File Server (port 443)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name lnw.cash www.lnw.cash;

    # =========================================================================
    # SSL Configuration
    # =========================================================================
    # สำหรับ production ที่มี Cloudflare:
    #   - ถ้าใช้ Cloudflare Origin Certificate → path ตามที่ Cloudflare ออกให้
    #   - ถ้าไม่ใช้ Cloudflare → ใช้ certbot (Let's Encrypt)
    # =========================================================================
    # ssl_certificate     /etc/nginx/ssl/lnw.cash.pem;      # ← Commander ใส่ค่าเอง
    # ssl_certificate_key /etc/nginx/ssl/lnw.cash.key;      # ← Commander ใส่ค่าเอง

    # TLS hardening (recommended by Mozilla SSL Configuration Generator)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cloudflare IP ranges — ตรวจสอบว่า request มาจาก Cloudflare จริง (ป้องกัน bypass)
    # จริง ๆ แล้ว Cloudflare จะ forward ด้วย header ต่อไปนี้หากตั้งค่าไว้
    # แต่เนื่องจากเราใช้ Cloudflare proxy อยู่แล้ว (orange cloud)
    # จุดนี้ Cloudflare จะเป็นคน terminate SSL — VPS รับ plain HTTP ก็ได้
    # อย่างไรก็ตาม เราใส่ SSL config ไว้สำหรับกรณีที่ต้องการ HTTPS end-to-end

    # =========================================================================
    # Document Root
    # =========================================================================
    root /var/www/lnw.cash;
    index index.html;

    # =========================================================================
    # Gzip Compression
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2
        font/woff
        application/manifest+json
        application/x-web-app-manifest+json;

    # =========================================================================
    # Security Headers
    # =========================================================================
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Content-Security-Policy ตั้งเบื้องต้น (Commander ปรับตามต้องการ)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    # HSTS (เฉพาะเมื่อ SSL ทำงานเต็มรูปแบบ — ปิดไว้ก่อนจนกว่า Cloudflare Full strict จะพร้อม)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # =========================================================================
    # Cache Rules
    # =========================================================================

    # --- index.html: no-cache (สำคัญมากสำหรับ SPA PWA) ---
    # Service worker ใช้ index.html เป็นตัวกำหนดเวอร์ชัน — ต้องไม่ cache นาน
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
        # ยังคง security headers
    }

    # --- /health endpoint (สำหรับ health check) ---
    # ถ้ามี static health file หรือ proxy ภายใน
    location = /health {
        # พยายาม serve health file แบบ static ถ้ามี
        # ถ้าไม่มี health file — fallback ไปที่ index.html (เหมือน route อื่น)
        # CI/CD ควรสร้าง health file:
        #   echo '{"status":"healthy","version":"COMMIT_HASH"}' > dist/health
        try_files /health =404;  # 404 ถ้าไม่มีไฟล์ — ไม่ fallback เพื่อให้ CI/CD รู้
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # --- Hashed assets (JS/CSS): immutable cache ---
    # Vite build assets มี content hash ในชื่อไฟล์ → cache ได้นาน
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # security headers ยังใช้กับ assets ด้วย
    }

    # --- Service Worker & Workbox ---
    # SW ต้องไม่ถูก cache — browser จะตรวจสอบอัปเดตจาก response headers
    location ~ ^/(sw\.js|workbox-.*\.js|registerSW\.js)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires 0;
        add_header Service-Worker-Allowed "/" always;
    }

    # --- Manifest & Icons ---
    # PWA manifest และ icons เปลี่ยนไม่บ่อย — cache ได้ 1 วัน
    location ~ ^/(manifest\.webmanifest|icon-.*\.png|favicon\.svg|icons\.svg)$ {
        expires 1d;
        add_header Cache-Control "public" always;
    }

    # --- Static files ทั่วไป ---
    location / {
        # SPA Routing Fallback:
        #   ถ้า request เป็นไฟล์ที่มีอยู่จริง → serve เลย
        #   ถ้าไม่ใช่ → fallback ไปที่ index.html (ให้ Svelte router จัดการ)
        try_files $uri $uri/ /index.html;

        # Cache เริ่มต้น: 1 ชั่วโมง สำหรับไฟล์ที่ไม่มีกฎเฉพาะ
        expires 1h;
        add_header Cache-Control "public" always;
    }

    # =========================================================================
    # Deny access to hidden files
    # =========================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # =========================================================================
    # Deny access to sensitive files
    # =========================================================================
    location ~* \.(env|git|gitignore|md|lock|json)$ {
        # อนุญาตเฉพาะ manifest.webmanifest และ JSON API response
        # บล็อก .env, .git, README.md, package-lock.json, etc.
        deny all;
        access_log off;
        log_not_found off;
    }

    # =========================================================================
    # Logging
    # =========================================================================
    access_log /var/log/nginx/lnw.cash-access.log;
    error_log  /var/log/nginx/lnw.cash-error.log warn;
}
