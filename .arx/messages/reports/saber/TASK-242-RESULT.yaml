summary: |
  Removed the Vite dev-server /api/mint proxy special-case and switched all
  mint traffic to direct fetch of the absolute mint URL. The mint already sends
  `Access-Control-Allow-Origin: *` with a valid CA cert (verified), so the proxy
  was dev-only dead weight and a source of intermittent 502s on swap.

  1. client.ts fetchFromMint: removed `if (window && mintUrl === mint.lnw.cash)
     → /api/mint...` branch; now always `url = normalizeMintUrl(mintUrl) + path`.
     Added transient-5xx (502/503/504) retry: 1 initial + 2 retries with
     exponential backoff (250ms → 500ms) as belt-and-suspenders against 502.
  2. keyset.ts: direct `${mintUrl.replace(/\/+$/,'')}/v1/keys`.
  3. mint-validation.ts: direct `${normalizedUrl}/v1/info`.
  4. Receive.svelte:187 + :214: direct mint quote / quote-state URLs.
  5. Send.svelte:187: direct melt quote URL.
  6. vite.config.ts: removed server.proxy['/api/mint'] block (kept https key/cert).
  7. client.test.ts: added retry tests + updated 502 non-JSON test.

