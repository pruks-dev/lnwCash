design_notes:
  - Deterministic because secret/r are pure functions of (seed, keyset_id, counter_k):
    same inputs → identical BlindedMessages → mint can re-issue signatures (NUT-09) after
    device loss. This is the "seed = complete backup" model.
  - seed = 64-byte BIP39 seed (mnemonicToSeed from TASK-205), NOT the 32-byte private key,
    to stay byte-compatible with NUT-13 reference vectors.
  - Integration follow-up (non-blocking): app layer should call
    setActiveSeed(seedFromMnemonic(mnemonic)) at unlock (state.ts is out of TASK-206 scope);
    until then mint.ts falls back to random secrets (existing behavior, no breakage).
  - Legacy keyset version "00" (BIP32) throws by design — deprecated by NUT-13.

