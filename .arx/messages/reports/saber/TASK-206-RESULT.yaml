summary: |
  NUT-13 Option A (Commander D6): seed = complete backup. Implemented deterministic
  HMAC-SHA256 KDF so proof `secret` + blinding factor `r` are reproducible from the
  64-byte BIP39 seed, plus NUT-9 POST /v1/restore client + full restore flow +
  per-keyset counter_k tracking. All wallet-side (no mint change).

  Key changes:
  - nut13.ts (NEW): deriveSecretAndR() / deriveSecret() per NUT-13 "HMAC-SHA256
    Derivation" — message = "Cashu_KDF_HMAC_SHA256" || keyset_id_bytes || counter_k(8B BE)
    || type (0x00 secret, 0x01 r = OS2IP(HMAC) % N). Version-gated: "01"→HMAC, "00"→throw
    (legacy BIP32), else throw. seedFromMnemonic() + in-memory setActiveSeed/getActiveSeed.
  - counterK.ts (NEW): per-keyset counter_k in localStorage `lnwcash_counter_k`
    (get/set/increment/reset/getAll/clear).
  - restore.ts (NEW): restoreBatch() (derive→blind→POST /v1/restore→unblind) and
    restoreWallet() (batch loop, stop after 3 empty batches, NUT-7 spent filter,
    record counter_k).
  - client.ts: STANDARD_PATHS.restore='/v1/restore', resolveEndpointPath 'restore' case,
    restoreOutputs() + Restore* types.
  - mint.ts: generateSecret() → deterministic KDF from seed; createOutputs/completeMint
    use per-keyset counters + advance counter_k after successful mint. Random fallback
    retained when no seed is active (backward compatible).

  Verification:
  - Official NUT-13 V2 test vectors (cashubtc/nuts tests/13-tests.md): 5/5 secrets AND
    5/5 blinding factors match byte-for-byte → proves spec compliance.
  - Restore round-trip (real secp256k1 blind/unblind + mocked mint): PASS.
  - Full backend suites: 425 passed / 425 (27 files) — no regressions.
  - svelte-check: 0 errors in TASK-206 files (16 pre-existing errors elsewhere, untouched).
  - Mint NUT-09 verify: REAL (live https://mint.lnw.cash/v1/info) → "9":{"supported":true},
    "7":{"supported":true}. NOT mocked.

