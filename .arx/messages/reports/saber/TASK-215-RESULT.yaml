summary: |
  F-027-001 part 1 — NUT-13 seed wiring at the wallet lifecycle level.

  state.ts:
    - import setActiveSeed / clearActiveSeed / seedFromMnemonic from ./nut13
    - unlockWallet(): after private-key decrypt, decrypts stored BIP39 mnemonic
      (getEncryptedMnemonic) and calls setActiveSeed(seedFromMnemonic(mnemonic))
      inside try/catch — graceful skip on corrupt/missing mnemonic (legacy 24-word
      wallets store none). No crypto derivation changed.
    - lockWallet() + deleteWallet(): added clearActiveSeed() alongside
      unlockedPrivateKey = null.

  Consequence handled: setting the active seed flips the mint path to deterministic
  NUT-13 derivation (mint.ts:273 already reads `seed ?? getActiveSeed()`). The
  pre-existing mint.test.ts used a fake keyset ID 'keyset-abc123' that is NOT a
  valid NUT-13 v2 keyset, so deriveSecretAndR (correctly) rejected it. Updated the
  test fixture to the official v2 keyset ID (same as mint-nut13.test.ts) — a
  fixture correction only, no production code changed.

  Pre-existing flaky failures (verified by reverting my change, still fail):
    - lockout.test.ts  1-2 tests — "Test timed out in 5000ms" (PBKDF2 600k iters)
    - autolock.test.ts — flaky under full-suite load (passes in isolation)
  Both unrelated to seed wiring.

