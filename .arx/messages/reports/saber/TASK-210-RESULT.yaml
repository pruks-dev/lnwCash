summary: |
  Implemented configurable idle-timeout auto-lock for the wallet (default 5 min).

  Key changes:
  - autolock.ts (NEW): AutoLockTimer singleton. Idle detection via window
    mousemove/keydown/touchstart + document visibilitychange (resets when visible).
    Lock action = clearSessionPin() + lockWallet() + navigateTo('home') + showToast(...)
    (all re-used from existing state.ts / router.ts / stores/toast.ts — nothing re-implemented).
    In-flight tx guard via beginTransactionGuard()/endTransactionGuard() reference count +
    withTransactionGuard() wrapper; while a mint/melt is in flight the timeout is DEFERRED
    (re-checked every 1000 ms) so the wallet is NEVER locked mid-transaction.
  - storage.ts (NEW functions only): migration key lnwcash_autolock_timeout —
    getAutolockTimeoutMinutes() (default 5) / setAutolockTimeoutMinutes() (clamps >= 0).
    Existing storage functions untouched.
  - Settings.svelte: added Security section with timeout dropdown 1/5/15/30/60/Never
    (+ "Never" warning). Selecting a value persists + applies the timer; Settings mount
    arms the timer via startAutoLock().

  Verification:
  - New suites: autolock (23 tests) + Settings.autolock (6 tests) — ALL PASS (fake timers).
  - Regression: existing Settings + state tests still pass (27 tests).
  - svelte-check: 0 errors in my files (autolock.ts / Settings.svelte / storage.ts).
    Remaining 16 errors are in other agents' in-progress files, none touched by me.

  Integration note (outside bounded slice — deferred):
  - startAutoLock() should be invoked on wallet unlock at app level (App.svelte/Setup.svelte),
    and withTransactionGuard()/beginTransactionGuard() should wrap mint/melt flows in
    mint.ts/melt.ts/screens. These files are not in this sub-agent's allowed list.

