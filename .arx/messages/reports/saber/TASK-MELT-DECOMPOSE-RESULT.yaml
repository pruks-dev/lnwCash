verdict: COMPLETE

summary: |
  Emergency fix — melt change decompose เป็น denominations (fund-loss bug).

  Root cause: completeMelt() submitted change as a single output
  `{ amount: changeAmount }`. A mint signs each output with a keyset
  denomination key, so an off-denomination amount (30) is truncated to the
  nearest lower denomination (16) → 14 sats lost (Commander live test:
  proof [32,32]=64 → pay 32 + fee 2 = 34 → change 30 came back 16).

  1. Decompose change: `const changeAmounts = decomposeAmount(changeAmount)`
     (30 → [16,8,4,2]). `decomposeAmount` imported from ./mint (no circular
     import — mint.ts never imports melt.ts).
  2. Derive one secret per denomination: loop over changeAmounts, deriving
     `deriveSecretAndR(seed, changeKeysetId, startCounter + i)` via
     generateChangeSecretAndR(keysetId, counterIndex). Seed still required —
     requireChangeSeed() throws the same migration error (never random fallback).
  3. One blinded output per denomination: outputs = changeAmounts.map(...).
  4. Advance counter by changeAmounts.length (not 1).
  5. Unblind each signature — existing response.change.map((sig,i)=>outputs[i])
     now maps 1:1 across all denominations.

