summary: |
  Route production Receive flow through the deterministic mint.ts completeMint()
  path, and make fund recovery multi-mint aware.

  Receive.svelte completeMintAfterPayment():
  - removed the inline crypto.getRandomValues blinded-output block (decompose →
    random secret → blind → mintTokens → unblind → addProofs)
  - now: getPrivateKey() (WalletLockedError still propagates to unlock prompt) →
    fetchAndCacheKeysets + pick active keysetId → withTransactionGuard(() =>
    completeMint(mintUrl, quoteId, amount, keysetId, true))
  - completeMint() derives NUT-13 secrets from getActiveSeed() + advances counterK
    (deterministic, seed-recoverable)
  - if completeMint returns {success:false} with a locked-wallet error, re-throw
    WalletLockedError so the unlock-prompt retry flow still works
  - added pendingTxId null guards (also cleared 2 pre-existing svelte-check errors)

  Setup.svelte restoreFunds():
  - was: getActiveMintUrl() once → restore single mint
  - now: getAllMintConfigs() → per mint: fetchAndCacheKeysets → restoreWallet()
    per active keyset → accumulate restoredProofs
  - added restoreProgress state + UI ("{i}/{n}: {name|url}") for honest per-mint status

  Did NOT touch completeMint() signature/crypto, state.ts, or the WalletLockedError
  unlock-prompt flow.

