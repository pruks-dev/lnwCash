summary: |
  Change PIN modal (Settings.svelte) converted from 3 plain text <Input> fields
  to a 3-step sequential NUMPAD flow, mirroring Setup.svelte's PIN-entry pattern.
  Pure UI/UX change — all business logic (submitChangePin validation + changePin
  crypto, state.ts, $lib/wallet/*.ts) is preserved verbatim.

  NOTE (honesty): Commander did not assign an explicit TASK-ID; I assumed TASK-228
  (next sequential after TASK-227).

  The 3 steps:
    1. current PIN  — settings.change_pin.current_pin
    2. new PIN      — settings.change_pin.new_pin
    3. confirm new  — settings.change_pin.confirm_new_pin
  Each step shows a title + PinDots(length) + Keypad(shuffle=pinShuffle). Entering
  the 4th digit auto-advances; step 3 auto-calls submitChangePin() on the 4th digit.
  A step header (back "←" button on steps 2-3 + "Step X of 3" indicator) lets the
  user go back. Backspace on an empty field also steps back.

  Error handling (preserves logic, adds UI reset):
    - wrong current PIN (InvalidPinError) → back to step 1, clear currentPin,
      keep changePinError visible, PinDots error + shake.
    - mismatch (newPin !== confirmNewPin) → back to step 2, clear newPin + confirmNewPin,
      PinDots error + shake.

  The explicit submit Button (and Cancel Button) were REMOVED — auto-submit on the
  4th confirm digit plus the step indicator/back button make the flow obvious; the
  modal header still has an "X" close. changePinLoading still disables the keypad.
  "forgot PIN" link kept.

