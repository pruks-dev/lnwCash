summary: |
  T246-SEC-01 CRITICAL remediation (Commander-ordered Option A, fast-lane).

  Fund-loss window in migrateWallet() Phase B commit is closed. Old order was
  `addProofs(new) → removeProofs(old) → … → setActiveSeed → setEncryptedMnemonic`,
  so a crash between removeProofs(old) and setEncryptedMnemonic left old proofs
  burned at the mint with the new mnemonic unpersisted → permanent fund loss.

  New order (atomic + recoverable at every checkpoint):
    1. verifyPin → generateMnemonic → mnemonicToSeed (unchanged)
    2. persist NEW encrypted mnemonic + activate NEW seed BEFORE any swap (recovery
       anchor), capture prevMnemonic/prevSeed, write "pending migration" journal
    3. Phase A swap (network-only) in try/catch — on failure roll back to
       prevMnemonic/prevSeed (or clear for legacy) + clear journal + rethrow
    4. Phase B commit: addProofs(new) → removeProofs(old) → setCounterK → clear journal

  No checkpoint remains where proofs are burned but the new seed is unrecoverable:
    - crash before swap  → old wallet intact (journal marks pending → resume)
    - crash after swap   → recover from new mnemonic (NUT-13 restore)
    - crash after commit → clean (journal cleared)

  Added: MIGRATION_JOURNAL_KEY + getMigrationJournal/clearMigrationJournal/
  recoverPendingMigration (app-start recovery hook, future wiring), journal-aware
  detectLegacyProofs (resume path). Crypto/NUT-13/determinism/Settings.svelte
  untouched.

