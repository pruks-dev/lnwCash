summary: |
  Added a blocking "restoring" step to the wallet RECOVERY flow in Setup.svelte
  (Svelte 5). The user can no longer press "start using" while the NUT-9 fund
  restore is running — navigation is fully blocked until restore completes.

  NOTE (honesty): Commander did not assign an explicit TASK-ID; I assumed
  TASK-229 (next sequential after TASK-228).

  New recover flow: welcome → seed → pin → restoring → done.
  Create flow unchanged: welcome → seed → verify → pin → done (NO 'restoring').

  Behavior on the 'restoring' step:
    - running: centered spinner + "Restoring funds from the mint..." +
      per-mint progress line (restoreProgress).
    - error:   error message + "Retry" button (common.retry) that re-calls
      restoreFunds with the cached seed bytes.
    - done:    auto-advances to 'done' via a $effect (restoreStatus === 'done').
    - NO PWA nudge, NO "start using" button, NO back/next, NO stepper.

  Navigation blocking (3 layers):
    1. ProgressStepper is not rendered during 'restoring' (wrapped in {#if step !== 'restoring'}).
    2. goBack() is a no-op when step === 'restoring'.
    3. The existing beforeunload exit warning already covers 'restoring'
       (it only exempts unlock/welcome/done).

  Restore logic (restoreFunds, activateSeedAndRestore, restoreWallet,
  NUT-9/NUT-13 crypto) is PRESERVED verbatim. The only change to
  activateSeedAndRestore is a single cache line (restoreSeedBytes = seedBytes)
  so the retry button can re-run restoreFunds after the seed string is cleared
  for security.

