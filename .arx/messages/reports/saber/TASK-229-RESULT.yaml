deviations:
  - >
    activateSeedAndRestore() gained ONE cache line (restoreSeedBytes = seedBytes).
    This is not a restore-logic change — it caches the already-computed BIP39 seed
    bytes so the retry button can re-call restoreFunds() after the seed string is
    cleared at finalization (the seed string must be cleared for security, so
    retry cannot re-derive from `seed`).
  - >
    recovery.restore.error text changed: en "Fund restore failed — retry from
    Settings" → "Fund restore failed"; th "การกู้คืนเงินล้มเหลว — ลองใหม่ได้จากตั้งค่า"
    → "การกู้คืนเงินล้มเหลว". Rationale: retry is now an INLINE button on the
    'restoring' step, so "retry from Settings" is now misleading.
  - >
    The NUT-9 restore status block was REMOVED from the 'done' step (Commander:
    "Separate the restore UI from the PWA/done UI"). The 'done' step now shows
    only the done message + PWA nudge + start button. Since 'done' is only reached
    after restore completes, the previous "running"/"error" branches there were
    dead code; the restored-proof count is reflected in the wallet balance.
  - >
    The restore completion message (recovery.restore.done) is transient: the
    auto-advance $effect moves 'restoring' → 'done' in the same reactivity flush,
    so the user sees the spinner until it flips to the "Wallet Ready" screen.
    Kept as a fallback branch for robustness only.
  - >
    New i18n key added: screen.setup.restoring_title (en "Restoring Funds" /
    th "กำลังกู้คืนเงิน"). common.retry already existed (en "Retry" / th "ลองอีกครั้ง")
    and is reused — not changed — so QRScan/History retry labels are unaffected.
  - >
    No test file edits were required: all 14 Setup tests pass as-is (the
    multi-mint restore test waits on restoreWallet calls, which still fire
    regardless of the new intermediate step).
  - >
    eslint on Setup.svelte reports 27 errors (26 pre-existing + 1 new of the
    same class). The new one is svelte/no-useless-children-snippet on the retry
    Button, which uses the identical {#snippet children()} pattern already used by
    every other Button in the file (6 pre-existing instances). The file is not
    lint-clean at HEAD due to misconfigured browser-global rules; the actual gate
    (svelte-check) is 0 errors / 0 warnings.
