summary: |
  Fixed the NUT-13 counter reuse root cause (F-V27-001) in src/lib/wallet/mint.ts.

  ROOT CAUSE FIX: incrementCounterK was AFTER addProofs, not in a finally. If
  addProofs (IndexedDB) throws after the mint already signed the outputs, the
  counter would not advance and the next mint re-derives the same B_ → the mint
  returns 400 {"detail":"outputs already signed","code":11003}. Moved the advance
  into a `finally` block so the counter ALWAYS advances once postMint returns
  signed outputs, regardless of addProofs success/failure.

  PATH 2 FIX (localStorage loss): added a guard before createOutputs — when a
  deterministic seed is active and counter_k === 0 but IndexedDB already holds
  proofs for this keyset (counter lost, proofs survived), throw an error directing
  NUT-9 restore instead of re-minting with counter 0.

