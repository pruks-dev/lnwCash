    TASK-240/241 had already landed in the working tree (uncommitted) when I
    started: client.ts (CashuError.code + isBenign, message "HTTP 400 (11003): …")
    and mint.ts (TASK-240 counter-reuse guard). I did NOT modify them. My handler
