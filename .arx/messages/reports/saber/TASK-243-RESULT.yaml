summary: |
  Guarded the second call site `checkPayment` in TransactionDetailSheet.svelte
  against latent double-submit → mint 400 (not covered by TASK-230's
  Receive.svelte guard). The old code called `completeMint(waitForPayment=false)`
  and then marked the tx confirmed UNCONDITIONALLY, ignoring completeMint's
  returned `{ success, error }` — so a 400 "outputs already signed" (already
  minted) could loop, and a real 400 could be falsely confirmed.

  Fix (minimal, TransactionDetailSheet.svelte only — mint.ts / client.ts /
  restore.ts untouched):

    1. Added `$state` re-entrancy guard `mintCompleting` (mirrors TASK-230).
       `checkPayment` bails at top if `checking || mintCompleting`; guard set
       before `await completeMint(...)`, released in a nested `finally`.

    2. Captured the `completeMint` result and classified its `error`:
       - 11003 "outputs already signed" → already-minted (benign) → confirmed, no retry loop.
       - 20002 "quote already issued"  → double-submit (benign) → confirmed.
       - other (incl. "outputs mismatch") → real → console.warn, keep pending, no auto-retry.

    3. Benign-vs-real split reads the structured `code` field (error object,
       TASK-241 CashuError.code) then falls back to a 5-digit code in the message
       (`"HTTP 400 (11003): …"`) then to the detail string ("outputs already
       signed" / "quote already issued"). All string-based fallbacks are gated by
       `isHttpErrorMessage()` (must start with "HTTP <status>") so the TASK-240
       counter-reuse guard error — whose client-side message only *mentions*
       "outputs already signed"/11003 — is NOT misclassified as benign.

    4. Split the old `PAID || ISSUED` branch: `state === 'ISSUED'` now marks
       confirmed directly WITHOUT re-submitting (no completeMint call), preserving
       the prior "confirmed" outcome and removing the latent re-submit.

