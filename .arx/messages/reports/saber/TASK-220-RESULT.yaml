summary: |
  Settings → Security: "เปลี่ยน PIN" (Change PIN) flow + PIN keypad shuffle toggle.

  Change PIN flow (modal in Settings.svelte):
    - current PIN + new PIN ×2 (confirm) password inputs.
    - validates new PIN >= 4 chars and new == confirm BEFORE calling backend.
    - calls changePin(currentPin, newPin) from $lib/wallet/state (TASK-219, UNCHANGED).
    - InvalidPinError -> wrong-PIN error, modal stays open; success -> showToast + close.
    - "Forgot PIN?" link -> navigateTo('setup') + #/setup?recover=1 -> Setup seed recovery.

  Shuffle toggle:
    - Security section checkbox bound to settings.pin_shuffle (default OFF).
    - persisted via setSettings({ pin_shuffle }) (local.ts DEFAULT_SETTINGS + merge).
    - Keypad.svelte `shuffle?: boolean` prop: false -> fixed 1-9+0; true -> Fisher-Yates
      via crypto.getRandomValues (CSPRNG), $effect reshuffles on prop flip.
    - Setup.svelte passes shuffle={pinShuffle} to both PIN keypads (create/recover/unlock).

  Constraints honored: changePin() backend (state.ts) and encrypt.ts NOT touched;
  shuffle defaults OFF; no plaintext PIN storage (in-memory component state only,
  cleared on close).

