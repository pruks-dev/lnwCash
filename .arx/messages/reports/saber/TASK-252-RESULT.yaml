summary: |
  restore.ts gap-tolerance fix — align /v1/restore signatures by B_ (not index)
  + advance counter_k to highest signed + 1 (not signature count).

  1. restoreBatch() F-V29-003: replaced `prepared[i]` index mapping with a
     Map<B_, {entry, offset}> lookup. Each signature is aligned to its prepared
     entry via the mint's echoed `response.outputs[i].B_` (FILTERED list), with
     request-order index as a compat fallback when `outputs` is absent. Unblind
     uses the MATCHED entry's blinding factor — no more garbage proofs when the
     mint skips unsigned counters.

  2. restoreWallet() F-V29-004: replaced `lastNonEmptyCounter = counter +
     proofs.length` with `lastNonEmptyCounter = highestSignedCounter + 1`, where
     highestSignedCounter (startCounter + max matched offset) is tracked in
     restoreBatch from the B_ match and computed BEFORE spent filtering. Gap
     (counter 0 unsigned, 1/2 signed) now yields counter 3, not 2.

  3. Merge with TASK-250 counter-0 guard: the gap handling is fully general
     (any skipped counter, not just counter 0), so restore never undercounts.

  4. New unit tests: gap alignment (unblind + secret correct, no garbage),
     counter highest+1 (incl. spent-filtered case), BIP32 version 00
     `00c25786d85a1dcd` gap round-trip (hardcoded BIP32 secrets so the test
     fails if routed through HMAC).

