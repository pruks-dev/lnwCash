verdict: COMPLETE

summary: |
  Fixed the intermittent 400 "quote already issued" race condition in the mint
  (Receive) flow of Receive.svelte (Svelte 5 PWA). Root cause was two defects in
  startQuotePolling():

    1. Double-submit race: the async setInterval callback cleared the interval
       AFTER `await getMintQuoteState(...)`, so with slow network two callbacks
       could overlap, both observe `state === 'PAID'`, and both call
       completeMintAfterPayment() → the mint POST /v1/mint/bolt11 was submitted
       twice → second submit 400.

    2. Wrong ISSUED handling: `state === 'ISSUED'` (tokens already issued) was
       treated the same as PAID, so completeMintAfterPayment() re-submitted an
       already-issued quote → 400 (or pollMintQuoteUntil hung since ISSUED ≠ PAID).

  Fix (minimal, Receive.svelte only — no change to mint.ts / cashu client /
  blind / NUT-13 crypto):

    - Added a `$state` re-entrancy guard `mintCompleting` (default false).
    - Interval callback bails at the TOP if `mintCompleting` is true.
    - Condition narrowed from `'PAID' || 'ISSUED'` → `'PAID'`.
    - On PAID: `mintCompleting = true` is set BEFORE clearInterval, then
      clearInterval + pollTimer = null + await completeMintAfterPayment().
    - Re-checked `mintCompleting` AFTER the await (a slower overlapping callback
      that already passed the top guard must not proceed to re-submit).
    - Guard reset in handleCreateInvoice (new mint), on success path, and on the
      non-wallet-locked error path so a failed mint can be retried.

  NOTE (honesty): Commander did not assign an explicit TASK-ID; I assumed
  TASK-230 (next sequential after TASK-228/TASK-229).

