deviations:
  - >
    ADDED a re-check `if (mintCompleting) return;` immediately after the await,
    in addition to the top-of-callback guard. The top guard alone does NOT fully
    close the described race: a second callback that already passed the top guard
    and is awaiting getMintQuoteState would still observe PAID and re-submit after
    the first callback set mintCompleting. This re-check is required for the fix
    to actually be correct and is otherwise behavior-neutral.
  - >
    `pnpm check` could not be run as-is: it triggers a `pnpm install`
    dependency-status step that fails with ERR_PNPM_IGNORED_BUILDS (es5-ext,
    esbuild — pre-existing environment config). I ran `svelte-check --tsconfig
    ./tsconfig.app.json` directly instead → 0 errors / 0 warnings. This is the
    actual check gate and it is green.
  - >
    Guard intentionally NOT reset in the WalletLockedError branch of
    completeMintAfterPayment() (which sets lightningState='idle', not 'error').
    That branch keeps the retry via unlockPendingOp and is outside the requested
    "error path" scope; it is covered anyway because the success/error paths both
    reset the guard after the retry resolves.

