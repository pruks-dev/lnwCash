summary: |
  TASK-249 (BLUEPRINT-003 v1.4.2 Wave 1 P0) — live repro against mint.lnw.cash
  (Nutshell/0.20.1, keyset 00c25786d85a1dcd) to pin the A2/A4 root cause before
  designing the fix.

  DECISIVE ANSWER 1 — NUT-9 /v1/restore DOES return melt-change AND swap
  signatures. Verbatim bodies (in repro-run.log) show both the spent mint proof
  and the melt-change (A2: 32 sat) / swap-receive (A4: 16 sat) signatures are
  returned. Nutshell stores every signed output (mint/melt-change/swap) in the
  same promises table and restores by B_. The task hypothesis "NUT-9 ไม่คืน
  melt/swap signature" is REFUTED.

  DECISIVE ANSWER 2 — counter_k reconstructs correctly ONLY when counters are
  contiguous. Clean A2 (mint@0 → melt-change@1) and clean A4 (mint@0 → swap@1)
  both reconstruct counter_k=2 and recover the change/swap proofs (with TASK-244
  determinism in place). With a GAP, restore undercounts and corrupts recovery.

  ROOT CAUSE (reproduced live, PART 3): counter_k is keyed by KEYSET only
  (counterK.ts:15) and is NOT cleared by deleteWallet() (storage.ts:226-240) or
  importSeed() (seed.ts:99-147). A stale counter makes a new seed mint/swap at a
  non-zero counter → counters 0..stale-1 never signed (GAP). restore.ts then
  breaks: restoreBatch maps response.signatures[i] → prepared[i] (restore.ts:102-103),
  but Nutshell returns a FILTERED list, so with a gap the signatures are unblinded
  with the WRONG blinding factor (garbage proofs) and assigned the wrong secret;
  and lastNonEmptyCounter = counter + proofs.length (restore.ts:176) undercounts
  (2 instead of 3). Result: the real swap/change proof is LOST, a garbage proof is
  recovered instead, and counter_k is undercounted.

  TASK-250 (running in parallel) does NOT fix this: it only guards counter_k===0
  (not stale non-zero), does not reset counter_k on delete/import, and does not
  touch restore.ts. The finding holds for both v1.4.1 and the TASK-250 tree.

  Production code NOT modified (repro imports/reads production modules only).

