    Documented in root-cause-report.md §6.
  - >
    NUT-09 response shape observed: Nutshell 0.20.1 returns a filtered
    {outputs, signatures} pair (only previously-signed B_, mutually aligned) — not a
    1:1 echo of the request as the NUT-09 spec text implies. This exact shape is
    what restore.ts mishandles under a gap.

