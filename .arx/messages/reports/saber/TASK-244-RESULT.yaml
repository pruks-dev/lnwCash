summary: |
  NUT-13 determinism end-to-end (F-V27-005): eliminated silent-fund-loss by
  deriving melt change + swap receive secrets deterministically from the active
  seed instead of crypto.getRandomValues.

  1. melt.ts (F-V27-005 change path):
     Replaced generateChangeSecret() (crypto.getRandomValues) with
     generateChangeSecretAndR(keysetId): getActiveSeed() null → throw clear
     migration error (TASK-245), NO random fallback; then
     deriveSecretAndR(seed, keysetId, getCounterK(keysetId)) → {secret, r};
     blindMessage(secret, r). After postMelt returns (mint signed change output),
     incrementCounterK(inputs[0].id, 1) runs BEFORE local markSpent/addProofs so a
     persistence failure can never cause counter reuse. WalletLockedError fallback
     (getPrivateKey) unchanged.

  2. tokenStore.ts (swap receive path):
     Added getPrivateKey() guard (WalletLockedError when locked) + getActiveSeed()
     null → throw migration error (no random fallback). Replaced the
     crypto.getRandomValues loop: per output i derive
     deriveSecretAndR(seed, fullId, getCounterK(fullId) + i) → blindMessage(secret, r).
     After swapProofs returns, incrementCounterK(fullId, decoded.proofs.length)
     runs before addProofs.

  3. melt.test.ts: keyset ID literal 'keyset-abc123' → valid 01-versioned 64-hex
     keyset ID (required now that change derives via deriveSecretAndR).

  4. New tests: melt-determinism.test.ts (4), tokenStore-determinism.test.ts (3).

