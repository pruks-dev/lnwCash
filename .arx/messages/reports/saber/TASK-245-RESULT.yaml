summary: |
  F-V26-003 (Re-seed → swap migration): legacy wallets with random-secret proofs
  (pre-v1.4.1 melt/swap) can now move to full NUT-13 determinism, user-confirmed.

  1. src/lib/wallet/migration.ts (NEW):
     - detectLegacyProofs(): read-only gate — no seed + no mnemonic => all proofs
       legacy; with seed => per-proof determinism check (secret vs deriveSecret
       for counter 0..counter_k).
     - migrateWallet(pin): verifyPin -> generateMnemonic -> mnemonicToSeed ->
       group unspent proofs by (mint,keyset) -> swapGroupForNewSeed (Phase A,
       network-only) -> commit (Phase B: addProofs -> removeProofs old ->
       setCounterK = swap count -> setActiveSeed -> encrypt new mnemonic).
     - NUT-29 batching: NUT29_MAX_BATCH_SIZE=1000, amount-balanced batches
       (outputs 1:1 with inputs).
     - Atomic: any swap failure throws BEFORE any write (no fund loss).

  2. counter_k init = swap count (NOT 0): setCounterK(keysetId, swappedOutputCount)
     so future mints never re-derive an output the mint already signed under the
     new seed.

  3. Settings.svelte: Security section gains "Migrate wallet" entry + modal
     (confirm -> PIN -> progress -> success/error). USER-CONFIRMED (MANDATE-029):
     explicit Continue + PIN re-entry required; never auto-migrates.

  4. i18n: settings.migrate.* (12 keys) in en.json + th.json, parity th=en.

