design_notes:
  - BIP39 is one-way (mnemonic -> PBKDF2 -> key), so new wallets persist the encrypted
    mnemonic for export; privateKeyToSeed() stays legacy-only.
  - Dual routing in seedToPrivateKey() is disjoint by word count (12 vs 24).
  - LEGACY_WORDLIST preserves the exact original 2045-word mapping (indices 0..2044) so
    existing 24-word phrases decode identically; padded to 2048 to avoid `undefined` words.

