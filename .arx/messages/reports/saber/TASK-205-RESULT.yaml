summary: |
  Migrated seed phrase from 24-word direct-map to 12-word BIP39 standard derivation
  (PBKDF2-HMAC-SHA512, 2048 iters, salt="mnemonic"+empty passphrase, 64-byte output,
  first 32 bytes = secp256k1 private key), with dual 12/24 support — legacy 24-word
  wallets still unlock/export unchanged.

  Key changes:
  - keys.ts: added BIP39 primitives (generateMnemonic, mnemonicToSeed, mnemonicToPrivateKey,
    entropyToMnemonic, mnemonicToEntropy). generateKeyPair() now derives the key from a
    fresh 12-word mnemonic (returns `mnemonic`). seedToPrivateKey() auto-detects 12 vs 24
    words. privateKeyToSeed() preserved as the legacy 24-word direct-map. Corrected the
    false claim at keys.ts:11 ("12 words = 128 bits, insufficient for secp256k1").
  - wordlist.ts: FIXED corruption — original list had only 2045 words (missing involve/iron/
    library/license/lift; contained non-standard africa/after). Now exports canonical
    WORDLIST (2048) + LEGACY_WORDLIST (original 2045 preserved verbatim, padded to 2048).
  - seed.ts/storage.ts/state.ts: new wallets persist the BIP39 mnemonic (encrypted) so it
    can be re-exported (BIP39 is one-way: key cannot be reverse-derived to a mnemonic).
    Legacy wallets keep only the encrypted key and re-derive their 24-word phrase on export.
  - index.ts: barrel exports for mnemonic storage.

  Verification:
  - Crypto suite (keys + seed + state): 3 files / 54 tests — ALL PASS
  - BIP39 known vectors (empty passphrase): 3/3 PASS, cross-checked against Node crypto.pbkdf2Sync
  - 24-word legacy backward compat: PASS (simulated v1 wallet with only encrypted key unlocks + exports)
  - svelte-check: 0 errors in changed files (16 pre-existing errors in 8 unrelated files, none touched)
  - Full suite: 928 passed / 4 failed — the 4 failures are pre-existing UI tests
    (ErrorBoundary.test.ts, Home.test.ts), verified unrelated via git stash

