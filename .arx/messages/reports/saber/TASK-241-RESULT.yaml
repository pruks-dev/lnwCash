summary: |
  Fixed both cashu-client correctness bugs from RC-4 (TASK-231).

  1. checkState NUT-07 encoding (HIGH — F-V27-002):
     client.ts:425 previously computed Y = hash_to_curve(hexToBytes(secret)),
     hex-decoding the 64-char hex secret into 32 raw bytes. blind.ts:135
     (blindMessage) derives Y = hash_to_curve(UTF8(secret)), so the points
     differed and the mint could never match the proof → always UNSPENT →
     NUT-07 double-spend detection + restore spent-filtering broken.
     FIX: changed to hash_to_curve(utf8ToBytes(p.secret)), matching blind.ts
     exactly. Import changed hexToBytes → utf8ToBytes.

  2. client.ts code field (LOW — F-V27-003):
     fetchFromMint dropped the `code` field from 4xx bodies. Now parses `code`
     (number|string) from the error body and includes it in the message as
     "HTTP <status> (<code>): <detail>". CashuError.code widened to
     number|string, added static BENIGN_CODES = {11003, 20002} and an isBenign
     getter (11003 already-signed and 20002 quote-already-issued are benign
     double-submits; anything else is real).

