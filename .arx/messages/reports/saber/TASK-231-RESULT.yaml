deviations:
  - >
    Verdict for the RC-4 error is REPRODUCED, but NOT via the task's suggested
    mint→melt→restore→mint flow: that flow reconstructs counter_k correctly and
    does not hit 11003. The 400 was reproduced by the actual trigger (counter
    reuse: new quote + already-signed B_), which the report documents with the
    exact HTTP semantics. This is an honest correction of the task's hypothesis.
  - >
    Melt could not be driven through meltFlow() against the live mint reliably
    because the FakeWallet auto-pays its own small mint-quote invoices, causing a
    race ("mint quote already paid") when the melt quote is created after a delay.
    The repro drives the melt via the client meltTokens() (random change secret,
    mirroring melt.ts) and documents that melt.ts never touches counter_k, so the
    counter trace is unaffected.
  - >
    checkState/restore spent-filtering is broken by the client.ts hexToBytes bug,
    so restoreWallet recovers the SPENT 64-sat proof as "unspent" during PART B.
    This is a pre-existing secondary bug (documented), not introduced by this task.

