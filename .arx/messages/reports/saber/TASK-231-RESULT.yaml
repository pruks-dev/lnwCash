summary: |
  Reproduced the live mint 400 "outputs already signed" (code 11003) against
  https://mint.lnw.cash (Nutshell/0.20.1, keyset 00c25786d85a1dcd) and confirmed
  the true root cause before determinism design.

  CAPTURED 400 body (verbatim): {"detail":"outputs already signed","code":11003}

  ROOT CAUSE (confirmed empirically):
    "outputs already signed" (11003) is triggered by NUT-13 counter REUSE — the
    wallet re-derives the same blinded message B_ (same seed + same counter_k)
    and submits it under a NEW mint quote. Semantics isolated against the live mint:
      - same quote + same output       → 200 (idempotent)
      - same quote + different output  → 400 {"detail":"quote already issued","code":20002}
      - NEW quote + already-signed B_  → 400 {"detail":"outputs already signed","code":11003}  ← RC-4 error
    The reuse comes from counter_k loss/desync (localStorage cleared without
    NUT-9 restore; or mint signed at the mint but incrementCounterK never ran —
    mint.ts:315-317 has incrementCounterK AFTER addProofs, not in finally).

  TASK HYPOTHESIS REFUTED:
    The restore.ts "counter + proofs.length" formula (restore.ts:176,183) is CORRECT
    for normal operation. Nutshell NUT-9 /v1/restore returns signatures for SPENT
    proofs too, so after mint→melt→restore the counter reconstructs to 1 correctly
    and the next mint succeeds (no 400). The described mint→melt→restore→mint flow
    does NOT reproduce 11003 (verified with real wallet functions).

  SECONDARY FINDINGS (real, out of scope):
    1. checkState always returns UNSPENT — client.ts:425 uses hash_to_curve(hexToBytes(secret))
       but blind.ts:135 derives Y = hash_to_curve(UTF8(secret)); different points → NUT-07
       spend-detection + restore spent-filtering broken.
    2. client.ts:287-299 drops the `code` field on 4xx (app shows "HTTP 400: outputs
       already signed" with no 11003).
    3. Melt change secret is RANDOM (melt.ts:416, F-V26-002) → unrecoverable on restore.

  Production code NOT modified (repro imports/reads production modules only).

