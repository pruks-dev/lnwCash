summary: |
  Settings screen PIN/Security section — "Approach A" redesign (UI/CSS + i18n only,
  zero business-logic change).

  NOTE (honesty): Commander did not assign an explicit TASK-ID; I assumed TASK-224
  (next sequential after TASK-223).

  The single "Security" grab-bag Card (raw h4 "Auto-lock" + hardcoded English +
  native <select> + raw lock-now <button> + Divider + Change PIN ListItem + custom
  <label>+checkbox shuffle) is split into TWO clean cards:

  Card 1 — "PIN & Security" (screen.settings.security_section):
    - Heading + "Change PIN" ListItem (openChangePin + trailing ArrowRight, unchanged)
    - Divider + shuffle toggle now uses a new reusable Toggle.svelte switch
      (<input type="checkbox" role="switch"> + track/thumb). Same
      handlePinShuffleToggle + pinShuffle state (checked + onchange). Keyboard
      accessible, focus-visible ring on track, prefers-reduced-motion respected.

  Card 2 — "Auto-lock" (screen.settings.autolock_section):
    - Heading + i18n description line.
    - Timeout control: native <select> REPLACED by a ListItem (title + trailing
      "5 นาที"/"ไม่ล็อก" + chevron) that opens the existing Modal (bottomsheet) with
      the 6 AUTOLOCK_OPTIONS as tappable .option-btn-style buttons (active + Check).
      Selection calls selectAutolockOption() -> reuses the UNCHANGED
      handleAutoLockChange() -> setAutolockTimeout(). 0 = Never preserved.
    - "Never" warning kept, now i18n (settings.autolock.warning).
    - "Lock now" uses the existing Button (secondary) instead of raw <button>.
      handleLockNow unchanged.

  All forbidden constraints honored: handlers/imports/$state declarations unchanged
  (only NEW presentation state showAutolockPicker + glue functions added);
  autolock.ts / state.ts untouched; Change PIN modal untouched; AUTOLOCK_OPTIONS
  untouched; no ts-ignore/any; no commit.

  Two test files updated to match the deliberate UI changes (NOT to hide failures):
    - Settings.autolock.test.ts: combobox -> modal picker; ALL logic assertions
      preserved (startAutoLock on mount, setAutolockTimeout(value), 0->warning,
      lockNow).
    - Settings.shuffle-toggle.test.ts: getByRole('checkbox') -> getByRole('switch')
      (role="switch" is the requested accessible pattern).

