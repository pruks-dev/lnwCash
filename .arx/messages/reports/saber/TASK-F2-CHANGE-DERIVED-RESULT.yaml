  - >
    Per task scope, only getCounterK/incrementCounterK were used (NOT withKeysetLock). The
    change derivation is NOT wrapped in a per-keyset lock, so two CONCURRENT sendTokens on the
    same keyset could still read the same counter and re-derive the same change secret (mint
    would reject the second as "outputs already signed"). Flagged for Minister as a follow-up
    if concurrent sends on one keyset are in scope (mirror of melt/tokenStore RC-3 guard).

