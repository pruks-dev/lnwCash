summary: |
  F2 fix (Thorne TASK-254) — transfer.ts P2P send CHANGE → NUT-13 derived,
  SEND stays random.

  1. Split the internal NUT-03 swap blind creation into two parts:
     - SEND (needAmounts): unchanged — crypto.getRandomValues (proofs go to recipient).
     - CHANGE (excessAmounts): deriveSecretAndR(seed, keysetId, getCounterK(keysetId) + i)
       → blindMessage(secret, r). Random change was unrecoverable on restore (fund loss).
  2. Require active seed BEFORE the swap try block: getActiveSeed() === null throws a
     clear migration error (no random fallback for change). The throw propagates (not
     swallowed by the swap-failure catch).
  3. After swapProofs success → incrementCounterK(keysetId, excessAmounts.length).
  4. Imports added: deriveSecretAndR, getActiveSeed (./nut13) + getCounterK,
     incrementCounterK (./counterK). nut13.ts / crypto primitives untouched.

