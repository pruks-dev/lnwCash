summary: |
  Close F-027-002 (lockout bypass on re-auth surface) + F-027-008 (6-digit remnant).
  UnlockPrompt.svelte previously called unlockWallet() directly with NO lockout
  check — 4-digit PIN brute-force on unlock was unrate-limited. Wired the shared
  lockout counter into the unlock surface and fixed maxlength 6→4.

  Wiring:
  - import getLockoutStatus / recordFailure / recordSuccess (+ LockoutStatus) from
    $lib/wallet/lockout
  - $effect on open → refreshLockout() → getLockoutStatus()
  - handleSubmit re-checks getLockoutStatus() FIRST: locked → block + return
    (never reaches unlockWallet)
  - InvalidPinError → recordFailure() → locked? show countdown : wrong-PIN error
  - success → recordSuccess() (reset) BEFORE onunlock()
  - locked state disables input + confirm, renders <p class="unlock-locked"
    role="alert" aria-live="polite"> with unlock.locked_soft / unlock.locked_hard
    (interpolates {time} as mm:ss via a 1s ticking derived countdown)
  - maxlength 6→4 (F-027-008)

  i18n: added unlock.locked_soft + unlock.locked_hard to BOTH en.json and th.json.
  Parity kept: en 351 keys == th 351 keys (identical key sets).

  Did NOT touch unlockWallet() (state.ts = TASK-215). No plaintext PIN/counter.

