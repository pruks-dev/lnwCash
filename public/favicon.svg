<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- LnwCash Wallet Favicon — F-050 FIX (TASK-085) -->
  <!-- Brand: LnwCash Wallet, Cyan #00bcd4, NOT lightning bolt -->
  <!-- Based on lnw-logo-144.png brand mark -->

  <!-- Cyan rounded square background -->
  <rect x="1" y="1" width="46" height="46" rx="11" fill="#00bcd4" />

  <!-- Wallet body -->
  <rect x="7" y="14" width="34" height="25" rx="4" fill="white" />

  <!-- Wallet fold flap (top curve) -->
  <path d="M7,14 Q24,4 41,14" fill="none" stroke="#00bcd4" stroke-width="3" stroke-linecap="round" />

  <!-- Card/note detail inside wallet -->
  <rect x="11" y="19" width="26" height="6" rx="2" fill="#00bcd4" opacity="0.3" />
  <rect x="11" y="27" width="18" height="3" rx="1.5" fill="#00bcd4" opacity="0.2" />
</svg>
